name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: pre-flight every shipped compound
        run: for f in compounds/*.yaml; do [ "$f" = compounds/template.yaml ] || scflow check "$f" || exit 1; done

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: scflow:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm scflow:ci doctor
      - name: SCF smoke test inside the container
        run: |
          mkdir -p runs && chmod 777 runs
          docker run --rm -v $PWD/compounds:/input:ro -v $PWD/runs:/work/runs scflow:ci \
            run /input/Nb_0GPa.yaml --outdir /work/runs/Nb --stop-after scf --nproc 2 --no-db
          grep -q "convergence has been achieved" runs/Nb/2_phonons/scf.out
