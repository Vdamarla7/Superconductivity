name: validate records

on:
  pull_request:
    paths: ["records/**"]
  push:
    branches: [main]
    paths: ["records/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: check records
        run: python scripts/check_records.py | tee -a "$GITHUB_STEP_SUMMARY"
