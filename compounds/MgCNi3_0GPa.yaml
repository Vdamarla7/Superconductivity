# ════════════════════════════════════════════════════════════════
#  Compound: MgCNi3 (Pm-3m, anti-perovskite) at ambient pressure
#  Reference: He et al. Nature 411, 54 (2001). Exp. Tc ≈ 7–8 K.
#             DFT EPW Tc ~7–10 K expected.
#
#  Why MgCNi3: simplest ternary cubic superconductor
#    • 5 atoms/cell (C + Mg + 3Ni) — smallest ternary case
#    • Pm-3m (221) → simple cubic, Mac-safe (no hex crash)
#    • Harmonically stable at 0 GPa (unlike CaH6/PdH)
#    • d-band superconductor: Ni:d + C:p hybridization at Ef
#    • Tests 3-species Wannier pipeline
#
#  Structure: Pm-3m, a = 3.812 Å (experimental)
#    C  at 1a: (0,0,0)
#    Mg at 1b: (0.5,0.5,0.5)
#    Ni at 3d: (0.5,0,0), (0,0.5,0), (0,0,0.5)
#  Verified: Pm-3m, 48 sym ops expected.
#
#  Pseudopotentials (USPP):
#    Ni.pbe-spn-rrkjus: semicore 3s+3p (8e/Ni × 3 = 24e, 12 bands)
#    Mg.pbe-spn-rrkjus: semicore 2s+2p (8e × 1 = 8e, 4 bands)
#    C.pbe-n-rrkjus:    no semicore (just 2s+2p)
#
#  bands_skipped = 1-16:
#    Ni-3s × 3  → bands 1-3  (~-110 eV)
#    Mg-2s      → band 4     (~-88 eV)
#    Ni-3p × 3  → bands 5-13 (~-68 eV)
#    Mg-2p      → bands 14-16 (~-51 eV)
#    = 32 electrons removed → 36e active → 18 filled bands ✓
#
#  Wannier: 3×Ni:d (15 WFs) + C:p (3 WFs) = 18 WFs
#  Note: dis_froz_max is an initial guess — verify from NSCF
#  eigenvalue scan (pipeline prints table before EPW pass1).
#  If EPW fails "too many bands" or "cannot bracket Ef", check
#  scan table in epw_pass1.out and update dis_froz_max, then
#  rerun: python pipeline.py --start-from epw1
# ════════════════════════════════════════════════════════════════

skip_vcrelax: true   # using experimental lattice constant

compound:
  prefix:       "MgCNi3"
  pressure_GPa:  0.0

structure:
  expected_spacegroup: Pm-3m
  ibrav: 0
  nat:  5
  ntyp: 3
  cell_parameters_angstrom:
    - [3.812000, 0.000000, 0.000000]
    - [0.000000, 3.812000, 0.000000]
    - [0.000000, 0.000000, 3.812000]
  species:
    - {symbol: C,  mass: 12.011, pseudo: C.pbe-n-rrkjus_psl.1.0.0.UPF}
    - {symbol: Mg, mass: 24.305, pseudo: Mg.pbe-spn-rrkjus_psl.1.0.0.UPF}
    - {symbol: Ni, mass: 58.693, pseudo: Ni.pbe-spn-rrkjus_psl.1.0.0.UPF}
  positions:
    - [C,  0.000000, 0.000000, 0.000000]
    - [Mg, 0.500000, 0.500000, 0.500000]
    - [Ni, 0.500000, 0.000000, 0.000000]
    - [Ni, 0.000000, 0.500000, 0.000000]
    - [Ni, 0.000000, 0.000000, 0.500000]

wannier:
  # Ni 3d + C 2p hybridized manifold at Ef.
  # NSCF scan: 4 flat Ni-d bands cluster at Ef (13.2→14.2 eV), band 19 enters
  # at Ef=14.22 eV. Frozen window can't span Ef with nbndsub=18 (19>18) or 19
  # (nbndsub=19+C:s gives NaN g from rank-deficient Fourier interpolation on
  # the 2×2×2 coarse grid — 8 k-pts too few for 19 WFs). Solution: no frozen
  # window (dis_froz_max=dis_froz_min=0.0) + pure disentanglement with Ni:d+C:p
  # as projections → a2f Allen-Dynes Tc (no egnv needed).
  nbndsub:     18
  nbnd:        50             # 18 filled + 32 empty for Wannier window
  bands_skipped: "exclude_bands = 1-16"
  projections:
    - "Ni:d"
    - "C:p"
  dis_win_min:   0.0
  dis_win_max:   35.0
  dis_froz_min:  0.0
  dis_froz_max:  13.2         # just below 13.219 eV where band 16 enters; 15 bands frozen
                              # below Ef (14.22 eV); 3 WFs disentangle 4 near-Ef Ni-d bands

eliashberg:
  muc:            0.10
  temperatures_K: [2, 4, 6, 8, 10, 12, 14]

#  ── RESULTS (ph.x electron_phonon='simple', 2021-04-21) ──────────────────
#  Method: ph.x electron_phonon='simple', 8×8×8 k-mesh, 2×2×2 q-grid
#  EPW Wannier approach FAILS for MgCNi3 (degenerate d-band NaN in g-matrices)
#  σ=0.04 Ry: λ=0.913, ωlog=132 K → Allen-Dynes Tc=7.9 K
#  σ=0.05 Ry: λ=0.867, ωlog=134 K → Allen-Dynes Tc=7.3 K
#  Experimental Tc ≈ 7–8 K ✓  (λ converges to ~0.87 at large σ; denser k-grid needed)
#  ──────────────────────────────────────────────────────────────────────────

dft:
  ecutwfc:    60.0
  ecutrho:   600.0
  degauss:    0.02
  scf_kgrid:  [8, 8, 8]
  coarse_kgrid: [2, 2, 2]   # phonon q-grid (ph.x); keep at 2×2×2 — phonons done
  epw_coarse_kgrid: [4, 4, 4]  # EPW Wannier k-grid; must be multiple of coarse_kgrid

epw:
  fine_kgrid:  [10, 10, 10]   # PoC; [20,20,20] for production
  fsthick:     1.0
  wscut:       0.5             # Ni max phonon ~40 meV; wscut=12×≈0.5 eV
  use_a2f:     true            # d-band: Allen-Dynes from α²F

reference:
  tc_exp_K: 8.0
  source: "He et al., Nature 411, 54 (2001)"
