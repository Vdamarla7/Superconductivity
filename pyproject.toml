[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scflow"
version = "0.1.0"
description = "First-principles superconducting Tc (Quantum ESPRESSO + EPW) with automated physics validation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=2.0",
    "spglib>=2.0",
    "ase>=3.22",
]

[project.optional-dependencies]
aws = ["boto3>=1.28"]
sscha = ["cellconstructor>=1.3", "python-sscha>=1.3"]
ml = ["mp-api>=0.41", "pymatgen>=2024.1", "scikit-learn>=1.4", "pandas>=2.0", "pyarrow>=14", "matminer>=0.9",
      "lightgbm>=4.0", "mace-torch>=0.3.10"]
dev = ["pytest>=7"]

[project.scripts]
scflow = "scflow.cli:main"

[tool.setuptools.packages.find]
include = ["scflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
