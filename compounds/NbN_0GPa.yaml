# ════════════════════════════════════════════════════════════════
#  Compound: NbN (Fm-3m, rock salt) at ambient pressure
#  Reference: Exp. Tc ≈ 16 K; DFT EPW Tc ≈ 12-16 K
#
#  Why NbN: cubic (Fm-3m), harmonically stable at 0 GPa, 2 atoms/cell
#  (fastest possible phonon run), d-band superconductor — completely
#  different physics from H3X (e-ph from Nb-d + N-p coupling).
#  Avoids QE 7.4.1 Apple Silicon ph.x SEGFAULT in hexagonal irreps (P6/mmm).
#
#  Structure: rock salt ibrav=2 (FCC), a=4.394 Å (experimental)
#  Nb at 1a (0,0,0); N at 1b (0.5,0.5,0.5) in primitive coords.
#  Verified: spglib → Fm-3m, 48 sym ops.
#
#  Note: ibrav=2 works here because both atoms sit at 0 and 0.5 only.
#
#  Wannier: Nb:s(1)+Nb:p(3)+Nb:d(5)+N:s(1)+N:p(3) = 13 WFs
#  Result (10³ grid, a2f): λ=2.47, ω_log=11 meV, Tc=19.8 K (μ*=0.10) / 16.6 K (μ*=0.18)
#  Literature: 12–16 K ✓
# ════════════════════════════════════════════════════════════════

skip_vcrelax: true   # using experimental lattice constant

compound:
  prefix:       "NbN"
  pressure_GPa:  0.0

structure:
  ibrav: 2
  A: 4.394
  nat:  2
  ntyp: 2
  species:
    - {symbol: Nb, mass: 92.906,  pseudo: Nb.pbe-spn-rrkjus_psl.1.0.0.UPF}
    - {symbol: N,  mass: 14.007,  pseudo: N.pbe-n-rrkjus_psl.1.0.0.UPF}
  positions:
    - [Nb, 0.000000, 0.000000, 0.000000]
    - [N,  0.500000, 0.500000, 0.500000]

wannier:
  # NbN band structure at Gamma (after exclude_bands=1-4):
  #   band 5:     Nb-5s/N-2s mixed at ~3.1 eV
  #   bands 6-8:  Nb-t2g at ~17.4 eV
  #   bands 9-11: Nb-eg at ~18.75 eV
  #   bands 12-13: crossing coarse Ef=20.57 eV (fine Ef=20.85 eV)
  # nbndsub=13: Nb:s(1)+Nb:p(3)+Nb:d(5)+N:s(1)+N:p(3) spans full valence manifold.
  # dis_froz_max=20.74 spans coarse Ef (20.57) with exactly 13 bands at the worst k-point.
  # Fine Ef shifts to 20.85 > dis_froz_max → frozen window misses fine Ef → use a2f path.
  # nbndsub=9 with no frozen window gives λ=50 (unphysical); this setup fixes it.
  nbndsub:     13             # Nb:s (1) + Nb:p (3) + Nb:d (5) + N:s (1) + N:p (3) = 13
  nbnd:        20
  bands_skipped: "exclude_bands = 1-4"   # N-2s (-35 eV) + N-2p (-11 eV) deep core bands
  projections:
    - "Nb:s"
    - "Nb:p"
    - "Nb:d"
    - "N:s"
    - "N:p"
  dis_win_min:   3.0          # just below band 5 bottom at Gamma (~3.1 eV)
  dis_win_max:   50.0        # 13th active band reaches 43.5 eV; need > 43.5 at all k-points
  dis_froz_min:  3.0
  dis_froz_max:  22.0         # spans fine Ef=20.964; band 14 starts at 24 eV (2 eV gap)

eliashberg:
  muc:            0.10
  temperatures_K: [4, 6, 8, 10, 12, 14, 16, 18]

dft:
  ecutwfc:    80.0
  ecutrho:   800.0
  degauss:     0.02
  scf_kgrid:  [12, 12, 12]
  coarse_kgrid: [4, 4, 4]

epw:
  fine_kgrid:  [10, 10, 10]
  fsthick:     1.0            # wider for entangled d-bands; 0.4 gives nkfs but egnv=0
  wscut:       0.5            # NbN max phonon ~70 meV; wscut=7x=0.5 eV
  use_a2f:     true           # d-band system: frozen window can't span Ef → use α²F path

paths:
  qe_bin:      "/Users/vdark/work/quantum/qe-7.4.1/bin"
  pseudo_dir:  "/Users/vdark/work/quantum/pslibrary/pbe/PSEUDOPOTENTIALS/"
