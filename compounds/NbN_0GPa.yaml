# ════════════════════════════════════════════════════════════════
#  Compound: NbN (Fm-3m, rock salt) at ambient pressure
#  Reference: Exp. Tc ≈ 16 K; DFT EPW Tc ≈ 12-16 K
#
#  Why NbN: cubic (Fm-3m), harmonically stable at 0 GPa, 2 atoms/cell
#  (fastest possible phonon run), d-band superconductor — completely
#  different physics from H3X (e-ph from Nb-d + N-p coupling).
#  Avoids QE 7.4.1 Apple Silicon ph.x SEGFAULT in hexagonal irreps (P6/mmm).
#
#  Structure: rock salt ibrav=2 (FCC), a=4.394 Å (experimental)
#  Nb at 1a (0,0,0); N at 1b (0.5,0.5,0.5) in primitive coords.
#  Verified: spglib → Fm-3m, 48 sym ops.
#
#  Note: ibrav=2 works here because both atoms sit at 0 and 0.5 only.
#
#  Wannier: Nb:d (5) + N:p (3) = 8 WFs
# ════════════════════════════════════════════════════════════════

skip_vcrelax: true   # using experimental lattice constant

compound:
  prefix:       "NbN"
  pressure_GPa:  0.0

structure:
  ibrav: 2
  A: 4.394
  nat:  2
  ntyp: 2
  species:
    - {symbol: Nb, mass: 92.906,  pseudo: Nb.pbe-spn-rrkjus_psl.1.0.0.UPF}
    - {symbol: N,  mass: 14.007,  pseudo: N.pbe-n-rrkjus_psl.1.0.0.UPF}
  positions:
    - [Nb, 0.000000, 0.000000, 0.000000]
    - [N,  0.500000, 0.500000, 0.500000]

wannier:
  # NbN band structure at Gamma: N-2s at -35.6 eV (band 1), N-2p at -11.3 eV (bands 2-4),
  # then Nb-d + N-p valence bands (5-13) crossing Ef=20.74 eV (coarse) / 20.816 eV (fine).
  # Exclude bands 1-4 (deep core), Wannierize bands 5-13 = 9 WFs.
  # NbN band structure (after exclude_bands=1-4):
  #   band 5: Nb-s/N-s at 3.1 eV
  #   bands 6-8: Nb-t2g at 17.4 eV
  #   bands 9-11: Nb-eg at 18.75 eV
  #   bands 12-13: crossing Ef at 20.6 eV
  # Problem: dis_froz_max cannot span Ef without exceeding nbndsub=9 at some k-points
  #   (at dis_froz_max >= 19.74, max bands = 11 > 9 at some k).
  # Solution: NO frozen window (dis_froz_max = dis_froz_min = 3.0) — pure disentanglement.
  #   Wannier90 optimally selects 9 WFs from all bands in [3.0, 30.0] without constraints.
  #   Standard approach for entangled d-band systems where froz window can't span Ef.
  nbndsub:     9              # Nb:s (1) + Nb:d (5) + N:p (3) = 9
  nbnd:        20
  bands_skipped: "exclude_bands = 1-4"   # N-2s (-35 eV) + N-2p (-11 eV) deep core bands
  projections:
    - "Nb:s"
    - "Nb:d"
    - "N:p"
  dis_win_min:   3.0          # just below band 5 bottom at Gamma (~3.1 eV)
  dis_win_max:   30.0
  dis_froz_min:  3.0
  dis_froz_max:  3.0          # = dis_froz_min → no frozen window; pure disentanglement

eliashberg:
  muc:            0.10
  temperatures_K: [4, 6, 8, 10, 12, 14, 16, 18]

dft:
  ecutwfc:    80.0
  ecutrho:   800.0
  degauss:     0.02
  scf_kgrid:  [12, 12, 12]
  coarse_kgrid: [4, 4, 4]

epw:
  fine_kgrid:  [20, 20, 20]
  fsthick:     1.0            # wider for entangled d-bands; 0.4 gives nkfs but egnv=0 (a2f path)
  wscut:       0.5            # NbN max phonon ~70 meV; wscut=7x=0.5 eV
  # Note: use a2f=.true. + eliashberg=.false. for d-band systems (avoids egnv/ephmat issues)
  # frozen window can't span Ef in NbN (too many bands at Ef exceed nbndsub)

paths:
  qe_bin:      "/Users/vdark/work/quantum/qe-7.4.1/bin"
  pseudo_dir:  "/Users/vdark/work/quantum/pslibrary/pbe/PSEUDOPOTENTIALS/"
